<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MobileIQ — Client Mockups</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f5f5f5; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:14px; color:#374151; }
  #pageHeader { height:62px; display:flex; align-items:center; background:#fff; border-bottom:2px solid #000; box-shadow:0 3px 8px rgba(0,0,0,0.18); padding:0 20px; }
  #pageHeader .brand { font-size:27px; font-weight:700; letter-spacing:-0.5px; color:#000; }
  #pageHeader .rp { font-size:22px; font-weight:700; color:#333; text-transform:uppercase; margin-left:6px; }
  .wrap { max-width:620px; margin:40px auto; padding:0 16px; }
  h4 { font-size:18px; font-weight:600; color:#111827; margin-bottom:24px; }
  .client-card { background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:20px; margin-bottom:12px; }
  .client-card h5 { font-size:15px; font-weight:700; color:#111827; margin-bottom:4px; }
  .client-card .date { font-size:12px; color:#9ca3af; margin-bottom:12px; }
  .client-card .links { display:flex; gap:12px; flex-wrap:wrap; }
  .client-card .links a { font-size:13px; color:#1a56db; text-decoration:none; }
  .client-card .links a:hover { text-decoration:underline; }
  .client-card .links .sep { color:#e5e7eb; }
</style>
</head>
<body>

<div id="pageHeader">
  <span class="brand">Headlight</span><span class="rp">Route Planner</span>
</div>

<div class="wrap">
  <h4>Client Mockups</h4>

  <div class="client-card">
    <h5>Rock Valley Culligan</h5>
    <div class="date">September 2026</div>
    <div class="links">
      <a href="rvc/">Route Planning</a>
      <span class="sep">·</span>
      <a href="rvc/directions.html">Driving Directions</a>
      <span class="sep">·</span>
      <a href="rvc/phone.html">Send to Phone</a>
    </div>
  </div>

</div>
</body>
</html>
